---
- name: Diagnose Image Pull BackOff Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ target_namespace }}"
      register: pods
      no_log: true

    - name: Find ImagePullBackOff pods
      ansible.builtin.set_fact:
        image_pull_pods: >-
          {{
            pods.resources
            | json_query(
                "[?status.containerStatuses[?state.waiting.reason=='ImagePullBackOff']]"
              )
          }}

    - name: Display ImagePullBackOff pods
      ansible.builtin.debug:
        msg: "{{ item.metadata.name }}"
      loop: "{{ image_pull_pods }}"

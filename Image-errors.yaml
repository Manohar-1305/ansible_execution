---
- name: Diagnose Image Pull BackOff Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get pod
      ansible.builtin.command:
        cmd: kubectl get pod "{{ pod_name }}" -n "{{ namespace }}" -o json
      register: pod_result
      changed_when: false

    - name: Display pod
      ansible.builtin.debug:
        msg: "{{ pod_result.stdout | from_json }}"

---
- name: Diagnose Image Pull BackOff Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Find ImagePullBackOff pods
      ansible.builtin.shell: |
        python -c '
        from kubernetes import client, config
        config.load_incluster_config()
        pods = client.CoreV1Api().list_namespaced_pod("{{ target_namespace }}")
        for pod in pods.items:
            for container in (pod.status.container_statuses or []):
                if container.state and container.state.waiting:
                    if container.state.waiting.reason == "ImagePullBackOff":
                        print(pod.metadata.name)
        '
      register: image_pull_pods
      changed_when: false

    - name: Display ImagePullBackOff pods
      ansible.builtin.debug:
        msg: "IMAGE PULL ERROR : {{ item }}"
      loop: "{{ image_pull_pods.stdout_lines }}"
      when: image_pull_pods.stdout_lines | length > 0

    - name: No ImagePullBackOff pods found
      ansible.builtin.debug:
        msg: "No ImagePullBackOff pods found in {{ target_namespace }}"
      when: image_pull_pods.stdout_lines | length == 0

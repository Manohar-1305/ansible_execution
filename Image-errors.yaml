---
- name: Diagnose Image Pull BackOff Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Find ImagePullBackOff pods
      ansible.builtin.shell: |
        python -c '
        from kubernetes import client, config
        import json

        config.load_incluster_config()
        v1 = client.CoreV1Api()

        pods = v1.list_namespaced_pod("{{ target_namespace }}")

        result = []

        for pod in pods.items:
            for container in (pod.status.container_statuses or []):
                if container.state and container.state.waiting:
                    if container.state.waiting.reason == "ImagePullBackOff":
                        result.append({
                            "name": pod.metadata.name,
                            "namespace": pod.metadata.namespace,
                            "container": container.name,
                            "image": container.image,
                            "reason": container.state.waiting.reason,
                            "message": container.state.waiting.message
                        })

        print(json.dumps(result))
        '
      register: image_pull_result
      changed_when: false

    - name: Display ImagePullBackOff pods
      ansible.builtin.debug:
        msg: "{{ image_pull_result.stdout | from_json }}"
